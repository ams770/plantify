name: plantdetection
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # ------------------------------ App Management ------------------------------ #
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.2.1
  go_router: ^17.2.3
  # ---------------------------------- Loading --------------------------------- #
  shimmer: ^3.0.0
  # ---------------------- Locatization -> Multi Language ---------------------- #
  easy_localization: ^3.0.4
  # ---------------------------------- Helpers --------------------------------- #
  share_plus: ^13.1.0
  url_launcher: ^6.2.4
  flutter_phoenix: ^1.1.1
  # ------------------------------- Cache Helper ------------------------------- #
  shared_preferences: ^2.2.2
  # ------------------------------------ UI ------------------------------------ #
  flutter_easyloading: ^3.0.5
  flutter_screenutil: ^5.9.0  
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^2.0.1
  image_picker: ^1.0.7
  file_picker: ^12.0.0-beta.3
  tflite_flutter: ^0.12.1
  camera: ^0.12.0+1
  # ------------------------------- tflite helper ------------------------------ #

  



# ---------------------------------------------------------------------------- #
#                                      Dev                                     #
# ---------------------------------------------------------------------------- #
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.3.5
  flutter_launcher_icons: ^0.14.4

# ---------------------------------------------------------------------------- #
#                             Splash Screen Creator                            #
# ---------------------------------------------------------------------------- #
# dart run flutter_native_splash:create
flutter_native_splash:
   color: "#ffffff"
   ios: true
   android: true
   fullscreen: true


# ---------------------------------------------------------------------------- #
#                           App Icon Launcher Creator                          #
# ---------------------------------------------------------------------------- #
# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"



# ---------------------------------------------------------------------------- #
#                                    Assets                                    #
# ---------------------------------------------------------------------------- #
flutter:

  uses-material-design: true

  assets:
    # ------------------------------------ App ----------------------------------- #
    - assets/translations/en-US.json
    - assets/translations/ar-SA.json
    # ------------------------------------ SVG ----------------------------------- #    
    - assets/svg/background.svg
    - assets/svg/onboarding_one.svg
    - assets/svg/onboarding_two.svg
    - assets/svg/onboarding_three.svg
    - assets/svg/augmanted_reality.svg
    - assets/svg/live.svg
    - assets/svg/circular_lines.svg
    - assets/svg/gallery.svg
    # ---------------------------------- Images ---------------------------------- #
    - assets/images/logo.png      
    - assets/flowers/
    # ------------------------------- tflite Model ------------------------------- #
    - assets/tflite/model.tflite
    - assets/tflite/labels.json
    - assets/tflite/labels.txt
    - assets/tflite/plants_details.json

    
    
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800      
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
